name: CGV seat watch

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min; each run polls ~9 min => near-continuous coverage
  workflow_dispatch: {}

concurrency:
  group: cgv-watch
  cancel-in-progress: true   # a new tick takes over from a stale one

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install playwright
        run: npm install playwright

      - name: Cache chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Poll seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_STATE_TOPIC: ${{ secrets.NTFY_STATE_TOPIC }}
          MINUTES: '9'
        run: node poll.js
